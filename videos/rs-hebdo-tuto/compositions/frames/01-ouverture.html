  <script>
    (function () {
      var ID = "01-ouverture";
      var F = 1 / 60;
      var tl = gsap.timeline({ paused: true });

      // svg-path-draw setup — measured lengths, never guessed
      function prep(list) {
        list.forEach(function (p) {
          var len = p.getTotalLength() * 1.03;
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        });
      }
      var rulePath = document.getElementById("o1-rule-path");
      var links = Array.prototype.slice.call(document.querySelectorAll(".o1-link"));
      var mailBar = document.getElementById("o1-mail-bar");
      prep([rulePath].concat(links, [mailBar]));

      // ---------- Scene 1 (0–3.5s) : papier, halo, filet, logo ----------
      tl.fromTo("#o1-halo", { opacity: 0 }, { opacity: 1, duration: 1.4, ease: "power1.out" }, 0);
      // respiration : chaîne de tweens scale aller/retour (sine.inOut), sans callback, seek-safe
      function breathe(target, tIn, tEnd, amp, half) {
        for (var t = tIn, k = 0; t < tEnd - 0.01; t += half, k++) {
          var d = Math.min(half, tEnd - t);
          tl.to(target, { scale: k % 2 === 0 ? 1 + amp : 1, duration: d, ease: "sine.inOut" }, t);
        }
      }
      breathe("#o1-halo", 0, 22, 0.03, 1.7);
      // ghost word drifts slowly
      tl.fromTo("#o1-ghost", { x: -28 }, { x: 28, duration: 22, ease: "none" }, 0);
      // rule draws (svg-path-draw)
      tl.to(rulePath, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 0.2);
      // logo — spring-pop-entrance, calm settle with a barely-there overshoot
      tl.fromTo("#o1-logo", { scale: 0.92, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.1)" }, 0.25);

      // ---------- Scene 2 (3.5–12s) : titre en cascade, sous-titre, pictos ----------
      // waterfall-entry : binary opacity via set, whip from below, power4.out
      var words = [
        { id: "#o1-w1", y: 34, d: 0.18 },
        { id: "#o1-w2", y: 30, d: 0.16 },
        { id: "#o1-w3", y: 30, d: 0.16 }
      ];
      words.forEach(function (w, i) {
        var t = 3.6 + i * 0.25;
        tl.set(w.id, { opacity: 1, y: w.y }, t);
        tl.to(w.id, { y: 0, duration: w.d, ease: "power4.out" }, t);
      });
      tl.fromTo("#o1-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 5.0);

      // pictogrammes : feuille / image / étoile on « vos articles, vos photos et vos chroniques »
      [["#o1-ic-doc", 8.2], ["#o1-ic-img", 9.1], ["#o1-ic-star", 10.0]].forEach(function (p) {
        tl.fromTo(p[0], { opacity: 0, x: 26 }, { opacity: 1, x: 0, duration: 0.55, ease: "power2.out" }, p[1]);
      });

      // ---------- Scene 3 (13–21s) : enveloppe barrée, puis les quatre étapes ----------
      tl.fromTo("#o1-mail", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.55, ease: "power3.out" }, 13.2);
      tl.to(mailBar, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 13.7);
      tl.to("#o1-mail", { opacity: 0, duration: 0.45, ease: "power1.out" }, 15.9); // s'efface (within-scene, not a frame exit)

      // pastilles — waterfall-entry across the four steps
      var dots = Array.prototype.slice.call(document.querySelectorAll(".o1-dot"));
      var labs = Array.prototype.slice.call(document.querySelectorAll(".o1-lab"));
      var t0 = 17.0;
      dots.forEach(function (el, i) {
        var t = t0 + i * 0.22;
        tl.set(el, { opacity: 1, y: 64 }, t);
        tl.to(el, { y: 0, duration: 0.2, ease: "power4.out" }, t);
        var tl2 = t + 0.2 - 2 * F;
        tl.set(labs[i], { opacity: 1, y: 40 }, tl2);
        tl.to(labs[i], { y: 0, duration: 0.16, ease: "power4.out" }, tl2);
      });
      // filet reliant les pastilles, tracé de gauche à droite (svg-path-draw, 70–80 % stagger)
      links.forEach(function (p, i) {
        tl.to(p, { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, 17.95 + i * 0.34);
      });

      // hold to 22s (allocated stillness; halo keeps breathing)
      tl.set({}, {}, 22);

      window.__timelines = window.__timelines || {};
      window.__timelines["01-ouverture"] = tl;
      tl.seek(0);
    })();
