      letter-spacing: -0.02em; color: #16140F; opacity: 0.06; white-space: nowrap; }

    .s1-ouverture-logo { position: absolute; left: 750px; top: 280px; width: 420px; height: 88px; transform-origin: 50% 50%; will-change: transform; }

    .s1-ouverture-title span { display: inline-block; will-change: transform; }

    .s1-ouverture-steps { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .s1-ouverture-step { position: absolute; top: 738px; width: 320px; margin-left: -160px; text-align: center; }

      box-shadow: 0 24px 60px -20px rgba(20,18,12,0.18); display: flex; align-items: center; justify-content: center;
      font-family: "Geist Mono", monospace; font-weight: 500; font-size: 26px; color: #E11D2E; will-change: transform; }
    .s1-ouverture-lab { margin-top: 14px; font-weight: 500; font-size: 24px; color: #2C2A23; will-change: transform; white-space: nowrap; }
    .s1-ouverture-links { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }

  <div id="root" data-composition-id="s1-ouverture" data-start="0" data-duration="6.38" data-width="1920" data-height="1080">
    <div class="clip s1-ouverture-paper" data-start="0" data-duration="6.38" data-track-index="0">
      <div class="s1-ouverture-halo" id="s1-ouverture-halo"></div>
      <div class="s1-ouverture-ghost" id="s1-ouverture-ghost">HEBDO</div>
      <svg class="s1-ouverture-grain" xmlns="http://www.w3.org/2000/svg">
        <filter id="s1-ouverture-grain-f"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect width="1920" height="1080" filter="url(#s1-ouverture-grain-f)"/>
      </svg>
    </div>

    <div class="clip" data-start="0" data-duration="6.38" data-track-index="1">
      <svg class="s1-ouverture-rule" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"><path id="s1-ouverture-rule-path" d="M 560 408 H 1360"/></svg>

      <img class="s1-ouverture-logo" id="s1-ouverture-logo" src="assets/logo-rs-france.png" width="420" height="88" alt="">

      <div class="s1-ouverture-title" id="s1-ouverture-title"><span id="s1-ouverture-w1">RS</span><span id="s1-ouverture-w2">Hebdo</span><span id="s1-ouverture-w3">Delivery</span></div>
      <div class="s1-ouverture-sub" id="s1-ouverture-sub">Édition rédaction</div>

      <div class="s1-ouverture-steps">

          <path class="s1-ouverture-link" d="M 842 770 H 1078"/>

        <div class="s1-ouverture-step" style="left:480px"><div class="s1-ouverture-dot">01</div><div class="s1-ouverture-lab">Type de papier</div></div>
        <div class="s1-ouverture-step" style="left:800px"><div class="s1-ouverture-dot">02</div><div class="s1-ouverture-lab">Rédaction</div></div>
        <div class="s1-ouverture-step" style="left:1120px"><div class="s1-ouverture-dot">03</div><div class="s1-ouverture-lab">Correction IA</div></div>
        <div class="s1-ouverture-step" style="left:1440px"><div class="s1-ouverture-dot">04</div><div class="s1-ouverture-lab">Vérification &amp; envoi</div></div>
      </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "s1-ouverture";
      var DUR = 6.38;
      var F = 1 / 60;
      var tl = gsap.timeline({ paused: true });

      // ---------- états initiaux cachés (hors timeline) ----------
      var words = ["#s1-ouverture-w1", "#s1-ouverture-w2", "#s1-ouverture-w3"];
      var dots = Array.prototype.slice.call(document.querySelectorAll(".s1-ouverture-dot"));
      var labs = Array.prototype.slice.call(document.querySelectorAll(".s1-ouverture-lab"));
      gsap.set("#s1-ouverture-logo", { opacity: 0, scale: 0.7 });
      gsap.set(words, { opacity: 0 });
      gsap.set("#s1-ouverture-sub", { opacity: 0 });
      gsap.set(dots, { opacity: 0 });
      gsap.set(labs, { opacity: 0 });

      // svg-path-draw : longueurs mesurées, jamais devinées
      function prep(list) {
        list.forEach(function (p) {
          var len = p.getTotalLength() * 1.03;
          p.style.strokeDasharray = len;
          p.style.strokeDashoffset = len;
        });
      }
      var rulePath = document.getElementById("s1-ouverture-rule-path");
      var links = Array.prototype.slice.call(document.querySelectorAll(".s1-ouverture-link"));
      prep([rulePath].concat(links));

      // respiration : chaîne de tweens scale aller/retour (sine.inOut), seek-safe
      function breathe(target, tIn, tEnd, amp, half) {
        for (var t = tIn, k = 0; t < tEnd - 0.01; t += half, k++) {
          var d = Math.min(half, tEnd - t);
          tl.to(target, { scale: k % 2 === 0 ? 1 + amp : 1, duration: d, ease: "sine.inOut" }, t);
        }
      }

      // ---------- ambiance : halo en place dès t=0, respire ; mot fantôme dérive ----------
      breathe("#s1-ouverture-halo", 0, DUR, 0.03, 1.7);
      tl.fromTo("#s1-ouverture-ghost", { x: -20 }, { x: 20, duration: DUR, ease: "none" }, 0);

      // ---------- Scene 1 (0–1.3s) : filet se trace, logo à ressort (0,2 s), titre mot par mot (0,3 → 0,8 s), sous-titre 1,3 s ----------
      tl.to(rulePath, { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 0);
      // spring-pop-entrance : scale → 1, power3.out, sans rebond
      tl.fromTo("#s1-ouverture-logo", { scale: 0.7, opacity: 0, y: 8 },
        { scale: 1, opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      // waterfall-entry : opacité binaire via set, fouettement depuis le bas, power4.out, gaps qui se resserrent
      var wf = [
        { id: words[0], t: 0.30, y: 70, d: 0.18 },
        { id: words[1], t: 0.30 + 0.18 + 2 * F, y: 48, d: 0.16 },
        { id: words[2], t: 0.30 + 0.18 + 2 * F + 0.16 - F, y: 44, d: 0.15 }
      ];
      wf.forEach(function (w) {
        tl.set(w.id, { opacity: 1, y: w.y }, w.t);
        tl.to(w.id, { y: 0, duration: w.d, ease: "power4.out" }, w.t);
      });
      tl.fromTo("#s1-ouverture-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.3);

      // ---------- Scene 2 (1.3–4.6s) : quatre pastilles en cascade (0,35 s d'écart, 1,6 → 2,7 s), filet qui se trace entre elles ----------
      var t0 = 1.6, GAP = 0.35;
      dots.forEach(function (el, i) {
        var t = t0 + i * GAP;
        tl.set(el, { opacity: 1, y: 64 }, t);
        tl.to(el, { y: 0, duration: 0.2, ease: "power4.out" }, t);
        var t2 = t + 0.2 - 2 * F;
        tl.set(labs[i], { opacity: 1, y: 40 }, t2);
        tl.to(labs[i], { y: 0, duration: 0.16, ease: "power4.out" }, t2);
      });
      // svg-path-draw : chaque segment relie deux pastilles réelles, part quand la suivante atterrit
      links.forEach(function (p, i) {
        tl.to(p, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t0 + (i + 1) * GAP + 0.08);
      });

      // ---------- Scene 3 (4.6–6.38s) : sur « Rolling Stone France » le logo pulse une fois, très légèrement ; tenue ----------
      tl.to("#s1-ouverture-logo", { scale: 1.04, duration: 0.35, ease: "sine.inOut" }, 4.0);
      tl.to("#s1-ouverture-logo", { scale: 1, duration: 0.5, ease: "sine.inOut" }, 4.35);

      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
