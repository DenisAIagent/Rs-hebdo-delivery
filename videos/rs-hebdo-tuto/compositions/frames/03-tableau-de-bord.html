      waterfall(stats, 13.0, 0.14, 56, 0.2);
      var COUNT_AT = 13.4, COUNT_DUR = 1.2, START_SCALE = 0.5;
      function fmt(n) { var s = String(n); return s.length > 3 ? s.slice(0, -3) + " " + s.slice(-3) : s; }
      stats.forEach(function (card) {

        var target = parseInt(val.getAttribute("data-to"), 10);
        tl.to(lab, { opacity: 1, duration: 0.4, ease: "power2.out" }, COUNT_AT - 0.1);
        // valeur : tween innerText (variante de la règle) + modifier de format — rendu dans render(), sans callback, seek-safe
        tl.to(val, { innerText: target, duration: COUNT_DUR, ease: "power3.out",
          modifiers: { innerText: function (v) { return fmt(Math.round(parseFloat(v))); } } }, COUNT_AT);
        tl.fromTo(val, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: "power3.out" }, COUNT_AT);
        if (suf) tl.fromTo(suf, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.6)" }, COUNT_AT + COUNT_DUR);
      });

      // ---------- Scene 3 (17–31s) : la liste, puis zoom sur les trois icônes ----------
      tl.fromTo("#o3-listhead", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 17.6);
      waterfall(Array.prototype.slice.call(document.querySelectorAll(".o3-tr")), 18.2, 0.2, 44, 0.18);

      tl.to("#o3-acts1", { scale: 1.35, duration: 0.5, ease: "power2.inOut" }, 23.0);
      var wires = ["o3-w1", "o3-w2", "o3-w3"].map(function (id) { return document.getElementById(id); });
      wires.forEach(prep);
      [["#o3-n1", "o3-w1", 23.6], ["#o3-n2", "o3-w2", 25.0], ["#o3-n3", "o3-w3", 26.4]].forEach(function (p) {
        tl.to("#" + p[1], { strokeDashoffset: 0, duration: 0.45, ease: "power2.out" }, p[2]);
        tl.fromTo(p[0], { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, p[2] + 0.25);
      });
      tl.to("#o3-acts1", { scale: 1, duration: 0.5, ease: "power2.inOut" }, 30.0);
      tl.to(["#o3-n1", "#o3-n2", "#o3-n3", "#o3-w1", "#o3-w2", "#o3-w3"], { opacity: 0, duration: 0.4, ease: "power1.out" }, 30.0);

      // ---------- Scene 4 (31–39s) : « Tous les numéros » ----------
      tl.to(CUR, { x: 1494 - 3, y: 578 - 3, duration: 0.85, ease: "power2.inOut" }, 32.5);
      // cursor-click-ripple : compression 0,12 s + onde depuis le centre du bouton
      tl.to(CUR, { scale: 0.85, duration: 0.12, ease: "power2.in" }, 33.5);
      tl.to(CUR, { scale: 1, duration: 0.12, ease: "power2.out" }, 33.62);
      tl.to("#o3-allbtn", { scale: 0.95, duration: 0.12, ease: "power2.in" }, 33.5);
      tl.to("#o3-allbtn", { scale: 1, duration: 0.12, ease: "power2.out" }, 33.62);
      tl.set("#o3-rp-all", { opacity: 1 }, 33.54);
      tl.fromTo("#o3-rp-all", { scale: 0 }, { scale: 4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, 33.54);
      tl.to("#o3-chev", { rotation: 180, duration: 0.3, ease: "power2.out" }, 33.6);
      // menu : dynamic-content-sequencing — chaque entrée gagne un temps proportionnel à sa longueur, timeline pré-calculée
      tl.fromTo("#o3-menu", { opacity: 0, scaleY: 0.9 }, { opacity: 1, scaleY: 1, duration: 0.25, ease: "power2.out" }, 33.65);
      var ITEMS = Array.prototype.slice.call(document.querySelectorAll(".o3-mi"));
      var BASE = 0.06, SEC_PER_CHAR = 0.008, cum = 33.75;
      var MENU_TL = ITEMS.map(function (el) { var start = cum; cum += BASE + el.textContent.length * SEC_PER_CHAR; return { el: el, start: start }; });
      MENU_TL.forEach(function (e) { tl.fromTo(e.el, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, e.start); });
      focus("o3-ring-menu", 34.3, null);
      tl.to(CUR, { x: 1494 + 60, y: 578 + 90, duration: 0.6, ease: "power2.inOut" }, 34.6);

      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};

    })();
