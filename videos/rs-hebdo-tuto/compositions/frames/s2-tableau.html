      <!-- liseré d'attention : carte « EN COURS · RSH 240 » (abs 318,312 → 636×116), puis tableau (abs 318,604 → 1288×186) -->
      <div class="s2-tableau-ring" id="s2-tableau-ring" style="left:308px;top:302px;width:636px;height:132px"><div class="s2-tableau-ring-in" id="s2-tableau-ring-in"></div></div>

      <!-- onde de clic au centre du bouton « Se connecter » (abs 1232,576), présente dès t=0 -->
      <div class="s2-tableau-ripple" id="s2-tableau-rp" style="left:1182px;top:526px"></div>
      <svg class="s2-tableau-cursor" id="s2-tableau-cursor" viewBox="0 0 38 54" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 3 L3 41 L12.5 32 L19 50 L26 47 L19.5 30 L33 30 Z" fill="#16140F" stroke="#FBF8F2" stroke-width="2" stroke-linejoin="round"/>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "s2-tableau";
      var DUR = 5.35;
      var tl = gsap.timeline({ paused: true });
      var CUR = "#s2-tableau-cursor";

      // ---------- états initiaux (hors timeline) : connexion visible, tableau de bord caché ----------
      var navEls = Array.prototype.slice.call(document.querySelectorAll(".s2-tableau-nv"));
      var casEls = Array.prototype.slice.call(document.querySelectorAll(".s2-tableau-cas"));
      gsap.set("#s2-tableau-dash", { opacity: 0 });
      gsap.set(navEls.concat(casEls), { opacity: 0 });
      gsap.set("#s2-tableau-ring", { opacity: 0 });
      gsap.set("#s2-tableau-ring-in", { scaleX: 0, scaleY: 0.04 });
      gsap.set("#s2-tableau-rp", { opacity: 0, scale: 0 });
      gsap.set("#s2-tableau-burst", { opacity: 0 });
      gsap.set("#s2-tableau-note-r", { opacity: 0 });
      gsap.set(CUR, { x: 1500, y: 790 });

      // respiration : chaîne de tweens scale aller/retour (sine.inOut), seek-safe
      function breathe(target, tIn, tEnd, amp, half) {
        for (var t = tIn, k = 0; t < tEnd - 0.01; t += half, k++) {
          var d = Math.min(half, tEnd - t);
          tl.to(target, { scale: k % 2 === 0 ? 1 + amp : 1, duration: d, ease: "sine.inOut" }, t);
        }
      }
      // waterfall-entry : opacité binaire via set, fouettement depuis le bas, power4.out
      function waterfall(els, t0, gap, y, d) {
        els.forEach(function (el, i) {
          var t = t0 + i * gap;
          tl.set(el, { opacity: 1, y: y }, t);
          tl.to(el, { y: 0, duration: d, ease: "power4.out" }, t);
        });
      }

      // ---------- ambiance ----------
      breathe("#s2-tableau-halo", 0, DUR, 0.03, 1.7);
      tl.fromTo("#s2-tableau-ghost", { x: 16 }, { x: -16, duration: DUR, ease: "none" }, 0);

      // ---------- Scene 1 (0–1.4s) : écran de connexion déjà rempli ; le curseur presse « Se connecter → » à 0,5 s ----------
      // cursor-click-ripple : déplacement power2.inOut, clic = compression 0,12 s + onde depuis le centre du bouton
      var CLICK = 0.5;
      tl.to(CUR, { x: 1232 - 3, y: 576 - 3, duration: 0.42, ease: "power2.inOut" }, 0.04);
      tl.to(CUR, { scale: 0.85, duration: 0.12, ease: "power2.in" }, CLICK);
      tl.to(CUR, { scale: 1, duration: 0.12, ease: "power2.out" }, CLICK + 0.12);
      // bouton comprimé puis relâché (ressort), halo rouge derrière
      tl.to("#s2-tableau-btn", { scale: 0.94, boxShadow: "0 4px 10px -6px rgba(179,14,31,0.5)", duration: 0.12, ease: "power1.in" }, CLICK);
      tl.to("#s2-tableau-btn", { scale: 1, boxShadow: "0 14px 30px -12px rgba(179,14,31,0.55)", duration: 0.55, ease: "back.out(1.6)" }, CLICK + 0.12);
      tl.fromTo("#s2-tableau-burst", { scale: 1, opacity: 0 }, { scale: 3.2, opacity: 0.5, duration: 0.45, ease: "power2.out" }, CLICK + 0.12);
      tl.to("#s2-tableau-burst", { opacity: 0, duration: 0.4, ease: "power2.in" }, CLICK + 0.5);
      // onde
      tl.set("#s2-tableau-rp", { opacity: 1 }, CLICK + 0.04);
      tl.fromTo("#s2-tableau-rp", { scale: 0 }, { scale: 4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, CLICK + 0.04);

      // ---------- Scene 2 (1.4–3.4s) : le contenu du navigateur se remplace (fondu croisé 0,4 s), cascade serrée 0,07 s ----------
      // dynamic-content-sequencing : états de l'écran pré-calculés, fondu croisé aux transitions uniquement
      var XF = 0.4;
      var STATES = [
        { el: "#s2-tableau-login", start: 0 },
        { el: "#s2-tableau-dash", start: 1.4 }
      ];
      STATES.forEach(function (s, i) {
        if (i === 0) return;
        tl.to(STATES[i - 1].el, { opacity: 0, duration: XF, ease: "power1.inOut" }, s.start);
        tl.fromTo(s.el, { opacity: 0 }, { opacity: 1, duration: XF, ease: "power1.inOut" }, s.start);
      });
      // le curseur s'écarte vers la marge pendant la bascule
      tl.to(CUR, { x: 1560, y: 820, duration: 0.8, ease: "power2.inOut" }, 1.4);
      // cascade : nav, « Bonjour Camille », carte rouge, Dropbox, quatre compteurs, en-tête de liste, tableau
      waterfall(navEls.concat(casEls), 1.5, 0.07, 44, 0.18);

      // liseré d'attention sur « EN COURS · RSH 240 » à 2,3 s : se dessine scaleX puis scaleY, respire
      var RING = "#s2-tableau-ring", RIN = "#s2-tableau-ring-in";
      tl.set(RING, { opacity: 1 }, 2.3);
      tl.fromTo(RIN, { scaleX: 0, scaleY: 0.04 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, 2.3);
      tl.to(RIN, { scaleY: 1, duration: 0.3, ease: "power2.out" }, 2.58);
      breathe(RING, 2.9, DUR, 0.012, 0.9);

      // ---------- Scene 3 (3.4–5.35s) : le liseré glisse sur « Mes livraisons », note de marge à 3,6 s, tenue ----------
      tl.to(RING, { y: 292, width: 1308, height: 206, duration: 0.6, ease: "power2.inOut" }, 3.4);
      tl.fromTo("#s2-tableau-note-r", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 3.6);

      tl.set({}, {}, DUR);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
