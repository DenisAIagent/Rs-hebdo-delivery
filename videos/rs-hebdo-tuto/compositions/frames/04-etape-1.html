  tl.fromTo("#e1-chip1",{opacity:0,scale:0.6},{opacity:1,scale:1,duration:0.45,ease:"back.out(1.8)"},13.0);
  tl.fromTo("#e1-chip2",{opacity:0,scale:0.6},{opacity:1,scale:1,duration:0.45,ease:"back.out(1.8)"},13.6);
  note("#e1-note-dropbox",13.9);
  cursorMove({x:1500,y:760},13.2,0.8);

  // ===== Scene 3 (15–32s): grid waterfall, glow per spoken type, limits in red
  var cards = gsap.utils.toArray(".e1-card");
  cards.forEach(function(c,i){ var at=16.0+i*0.18, off=i%4===0?70:50; tl.set(c,{opacity:1,y:off},at); tl.to(c,{y:0,duration:0.2,ease:"power4.out"},at); });

  // asr-keyword-glow on the cards (one linear driver)
  var ORDER=[0,1,3,4,5,6,7,2], TIM={}; ORDER.forEach(function(k,i){ TIM[k]={start:18.0+i*1.2,end:18.0+i*1.2+0.75}; });
  var ATT=0.15, REL=0.45, REST=0.12, SELECT_AT=32.85;
  function env(t,s,e){ if(t<s) return 0; if(t<e) return Math.min((t-s)/ATT,1); var re=e+REL; if(t<re) return 1-((t-e)/REL)*(1-REST); return REST; }
  function lerp(a,b,t){ return Math.round(a+(b-a)*t); }
  var ins = cards.map(function(c){ return c.querySelector(".in"); }), ttls = cards.map(function(c){ return c.querySelector(".ttl"); });
  var drv={t:0};
  tl.to(drv,{t:DUR,duration:DUR,ease:"none",onUpdate:function(){
    for(var i=0;i<cards.length;i++){
      var k=+cards[i].dataset.k, tm=TIM[k], e=env(drv.t,tm.start,tm.end);
      if(k===3 && drv.t>=SELECT_AT) e=1;
      ins[i].style.borderColor="rgb("+lerp(232,225,e)+","+lerp(226,29,e)+","+lerp(210,46,e)+")";
      ins[i].style.backgroundColor="rgb(255,"+lerp(255,228,e)+","+lerp(255,230,e)+")";
      ins[i].style.transform="scale("+(1+0.04*e)+")";
      ttls[i].style.textShadow="0 0 "+(18*e)+"px rgba(225,29,46,"+(0.5*e)+")";
      ttls[i].style.color=e>0.5?"#B30E1F":"#16140F";
    }
  }},0);

  tl.to(".e1-card .lim",{color:"#E11D2E",duration:0.25,ease:"power1.out"},29.0);
  tl.to(".e1-card .lim",{color:"#6A6557",duration:0.5,ease:"power1.inOut"},30.6);
  note("#e1-note-limite",29.2);

  // ===== Scene 4 (32–38.5s): select Chroniques, warning note, hold
  cursorMove(CHRON_C,31.8,0.85);
  cursorPress(32.75);
  ripple(CHRON_C,32.8);
  tl.to(cards[3].querySelector(".in"),{boxShadow:"inset 0 0 0 1px #E11D2E, 0 24px 60px -20px rgba(225,29,46,0.35)",duration:0.3},32.85);
  tl.fromTo("#e1-chip3",{opacity:0,scale:0.6},{opacity:1,scale:1,duration:0.45,ease:"back.out(1.8)"},33.1);
  cursorMove({x:1560,y:600},33.3,0.7);
  note("#e1-note-warn",34.2);

  tl.to({},{duration:0.01},DUR-0.01);
})();
</script>
