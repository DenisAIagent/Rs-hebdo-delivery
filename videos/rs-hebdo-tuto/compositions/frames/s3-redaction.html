  <div class="s3-file" id="s3-file"><div class="img"></div><div class="nm">pochette.jpg</div></div>
  <div class="s3-file ghost" id="s3-ghostfile"><div class="img"></div><div class="nm">pochette.jpg</div></div>

  <div class="s3-att" id="s3-att-count" style="left:300px;top:800px;width:690px;height:62px"></div>

  <div class="s3-ring" id="s3-ring1"></div><div class="s3-ring" id="s3-ring2"></div><div class="s3-ring" id="s3-ring3"></div>
  <div class="s3-cursor" id="s3-cursor"><svg width="37" height="54" viewBox="0 0 34 50"><path d="M1 1L1 39L10.5 30L17 46L24 43L17.5 27L31 27Z" fill="#16140F" stroke="#FBF8F2" stroke-width="2" stroke-linejoin="round"/></svg></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function(){
  var ID="s3-redaction", DUR=5.42;
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused:true });
  window.__timelines[ID] = tl;
  var q = function(s){ return document.querySelector(s); };

  // ---- absolute layout constants (frame 260,90 ; screen origin 288,198)
  var CHRON = {x:1470, y:519};                       // Chroniques card centre
  var GRIP  = {x:1780, y:530};                       // grip point on pochette.jpg
  var DROPC = {x:1306, y:588};                       // drop-zone centre
  var TDX = DROPC.x - GRIP.x, TDY = DROPC.y - GRIP.y;
  var RINGS = ["#s3-ring1","#s3-ring2","#s3-ring3"];

  // ---- initial states (outside the timeline, seek-safe)
  gsap.set("#s3-cursor", { x:1540, y:760, scale:1 });
  gsap.set(RINGS, { x:CHRON.x-50, y:CHRON.y-50, scale:0, opacity:0 });
  gsap.set(["#s3-liv2","#s3-file","#s3-ghostfile","#s3-placed","#s3-good","#s3-att-count","#s3-chip3","#s3-caret"], { opacity:0 });
  gsap.set("#s3-title span", { opacity:0 });
  gsap.set("#s3-count", { scale:0.7 });
  gsap.set("#s3-barfill", { scaleX:0 });

  // ---- helpers
  function move(to, at, dur){ tl.to("#s3-cursor", { x:to.x, y:to.y, duration:dur, ease:"power2.inOut" }, at); }
  function press(at){ tl.to("#s3-cursor", { scale:0.85, duration:0.12, ease:"power2.in" }, at); tl.to("#s3-cursor", { scale:1, duration:0.12, ease:"power2.out" }, at+0.12); }
  function ripple(at){
    tl.set(RINGS, { opacity:1 }, at);
    tl.to(RINGS, { scale:4, opacity:0, duration:0.7, ease:"power2.out", stagger:0.08, immediateRender:false }, at);
  }
  function attention(sel, at, until){
    tl.set(sel, { opacity:1, scaleX:0, scaleY:0.05 }, at);
    tl.to(sel, { scaleX:1, duration:0.3, ease:"power2.out" }, at);
    tl.to(sel, { scaleY:1, duration:0.3, ease:"power2.out" }, at+0.3);
    var t = at+0.6; while (t+1.6 < until){ tl.to(sel, { scale:1.015, duration:0.8, ease:"sine.inOut" }, t); tl.to(sel, { scale:1, duration:0.8, ease:"sine.inOut" }, t+0.8); t += 1.6; }
  }
  function fmt(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " "); }

  // ---- ambient
  tl.fromTo("#s3-ghost", { x:0 }, { x:-12, duration:DUR, ease:"none" }, 0);
  tl.to("#s3-halo", { scale:1.06, duration:2.71, ease:"sine.inOut" }, 0);
  tl.to("#s3-halo", { scale:1, duration:2.71, ease:"sine.inOut" }, 2.71);

  // ===== Scene 1 (0–1.2s): "Choisissez le format" — click Chroniques at 0.7
  move(CHRON, 0.2, 0.45);
  press(0.7);
  tl.to("#s3-chron", { scale:0.96, duration:0.12, ease:"power2.in" }, 0.7);
  tl.to("#s3-chron", { scale:1, duration:0.12, ease:"power2.out" }, 0.82);
  ripple(0.74);
  tl.to("#s3-chron", { borderColor:"#E11D2E", boxShadow:"inset 0 0 0 1px #E11D2E, 0 24px 60px -20px rgba(225,29,46,0.35)", duration:0.25 }, 0.78);
  tl.fromTo("#s3-chip3", { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.4, ease:"back.out(1.8)" }, 0.85);

  // ===== Scene 2 (1.2–3.2s): form replaces the grid, body fills in blocks, title composes, photo dragged in
  tl.to("#s3-liv1", { opacity:0, duration:0.35, ease:"power1.inOut" }, 1.2);
  tl.to("#s3-liv2", { opacity:1, duration:0.35, ease:"power1.inOut" }, 1.2);
  tl.fromTo("#s3-file", { opacity:0, x:40 }, { opacity:1, x:0, duration:0.5, ease:"power2.out" }, 1.3);

  // "écrivez" — discrete-text-sequence in bulk blocks (timeline sets, seek-safe)
  var B1 = "Quatrième album, et toujours cette manière de faire vaciller la nuit.";
  var B2 = B1 + " On y entre comme dans une salle vide, les guitares posées contre le mur, la voix qui hésite avant de tout renverser.";
  var B3 = B2 + " Rien n'est pressé, et pourtant chaque titre avance comme une marée.";
  var B4 = B3 + " « Nuit blanche » ne cherche pas la lumière : il l'attend.";
  var B5 = B4 + " C'est le disque d'un groupe qui a cessé de vouloir plaire, et qui n'a jamais été aussi juste.";
  var SEQ = [
    [1.40, "Q"], [1.48, "Quatr"], [1.56, "Quatrième "], [1.68, "Quatrième album, "],
    [1.80, "Quatrième album, et toujours cette manière "], [1.92, B1],
    [2.05, B1 + " On y entre comme dans une salle vide, "], [2.15, B2], [2.25, B3], [2.33, B4], [2.40, B5]
  ];
  var txt = q("#s3-txt");
  SEQ.forEach(function(s){ tl.set(txt, { textContent:s[1] }, s[0]); });
  tl.set("#s3-ph", { display:"none" }, 1.4);
  tl.to("#s3-body", { borderColor:"#E11D2E", boxShadow:"0 0 0 4px rgba(225,29,46,0.18)", duration:0.25 }, 1.4);
  [[1.40,1],[1.75,0],[2.10,1],[2.45,0]].forEach(function(c){ tl.set("#s3-caret", { opacity:c[1] }, c[0]); });
  tl.to("#s3-body", { borderColor:"#E8E2D2", boxShadow:"0 0 0 0px rgba(225,29,46,0)", duration:0.25 }, 2.6);

  // title composes (serif words, waterfall)
  var words = gsap.utils.toArray("#s3-title span"), tw = 1.5;
  words.forEach(function(w, i){
    var off = [60,50,40,50,55][i], d = [0.18,0.16,0.13,0.16,0.17][i];
    tl.fromTo(w, { opacity:0, y:off }, { opacity:1, y:0, duration:d, ease:"power4.out" }, tw);
    tw += d - 0.02;
  });

  // "ajoutez vos photos" — cursor-drag of pochette.jpg (2.0 → 2.8)
  move(GRIP, 1.45, 0.5);
  press(2.0);
  tl.to("#s3-file", { scale:0.94, duration:0.1, ease:"power2.in" }, 2.0);
  tl.set("#s3-file", { opacity:0 }, 2.1);
  tl.set("#s3-ghostfile", { opacity:0.85, x:0, y:0 }, 2.1);
  tl.fromTo("#s3-ghostfile", { scale:0.94 }, { scale:1.05, boxShadow:"0 40px 70px -20px rgba(20,18,12,0.4)", duration:0.12, ease:"power2.out", immediateRender:false }, 2.1);
  // travel: matched tweens, absolute endpoints (lockstep)
  tl.fromTo("#s3-ghostfile", { x:0, y:0 }, { x:TDX, y:TDY, duration:0.6, ease:"power2.inOut", immediateRender:false }, 2.2);
  tl.fromTo("#s3-cursor", { x:GRIP.x, y:GRIP.y }, { x:GRIP.x+TDX, y:GRIP.y+TDY, duration:0.6, ease:"power2.inOut", immediateRender:false }, 2.2);
  tl.to("#s3-drop", { backgroundColor:"#FBE4E6", borderColor:"#E11D2E", scale:1.02, duration:0.25 }, 2.5);
  // drop = state commit
  tl.set("#s3-ghostfile", { opacity:0 }, 2.8);
  tl.fromTo("#s3-placed", { opacity:0, scale:0.92 }, { opacity:1, scale:1, duration:0.25, ease:"power3.out" }, 2.8);
  tl.to("#s3-drop", { backgroundColor:"#FFFFFF", borderColor:"#D8D0BD", scale:1, duration:0.4 }, 3.05);
  move({ x:1520, y:790 }, 3.0, 0.5);

  // ===== Scene 3 (3.2–5.42s): "Le compteur de signes veille pour vous" — counting-dynamic-scale
  attention("#s3-att-count", 3.1, DUR);
  var COUNT_AT = 3.2, COUNT_DUR = 1.1, TARGET = 1480, STEPS = 33, ease = gsap.parseEase("power3.out");
  var countEl = q("#s3-count");
  for (var k = 1; k <= STEPS; k++){
    var p = k / STEPS;
    tl.set(countEl, { textContent: fmt(Math.round(TARGET * ease(p))) + " / 1 500 signes" }, COUNT_AT + COUNT_DUR * p);
  }
  tl.fromTo(countEl, { scale:0.7 }, { scale:1, duration:COUNT_DUR, ease:"power3.out" }, COUNT_AT);
  tl.to(countEl, { color:"#2D7A4B", duration:COUNT_DUR, ease:"power3.out" }, COUNT_AT);
  tl.fromTo("#s3-barfill", { scaleX:0 }, { scaleX:TARGET/1500, duration:COUNT_DUR, ease:"power3.out" }, COUNT_AT);
  tl.fromTo("#s3-good", { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.35, ease:"back.out(1.8)" }, 4.4);
  tl.to("#s3-body", { borderColor:"#2D7A4B", boxShadow:"0 0 0 4px rgba(45,122,75,0.18)", duration:0.3 }, 4.4);

  tl.to({}, { duration:0.01 }, DUR-0.01);
})();
</script>
