  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var ID = "02-connexion";
      var DUR = 31;
      var tl = gsap.timeline({ paused: true });
      var CUR = "#o2-cursor";

      // ---------- helpers ----------
      // liseré d'attention : se dessine scaleX puis scaleY, respire, puis se retire (tOut = null → tenu jusqu'à la fin)
      // respiration : chaîne de tweens scale aller/retour (sine.inOut), sans callback, seek-safe
      function breathe(target, tIn, tEnd, amp, half) {
        for (var t = tIn, k = 0; t < tEnd - 0.01; t += half, k++) {
          var d = Math.min(half, tEnd - t);
          tl.to(target, { scale: k % 2 === 0 ? 1 + amp : 1, duration: d, ease: "sine.inOut" }, t);
        }
      }
      function focus(id, tIn, tOut) {
        var w = "#" + id, inner = w + " .o2-ring-in", el = document.getElementById(id);
        tl.set(w, { opacity: 1 }, tIn);
        tl.fromTo(inner, { scaleX: 0, scaleY: 0.04 }, { scaleX: 1, duration: 0.3, ease: "power2.out" }, tIn);
        tl.to(inner, { scaleY: 1, duration: 0.3, ease: "power2.out" }, tIn + 0.28);
        var end = tOut == null ? DUR : tOut;
        breathe(w, tIn + 0.6, end, 0.012, 0.9);
        if (tOut != null) tl.to(w, { opacity: 0, duration: 0.3, ease: "power1.out" }, tOut);
      }
      // cursor-click-ripple : déplacement power2.inOut, clic = compression 0,12 s, une onde depuis le centre de la cible
      function moveTo(t, cx, cy, d) {
        tl.to(CUR, { x: cx - 3, y: cy - 3, duration: d, ease: "power2.inOut" }, t);
      }
      function click(t, rippleId) {
        tl.to(CUR, { scale: 0.85, duration: 0.12, ease: "power2.in" }, t);
        tl.to(CUR, { scale: 1, duration: 0.12, ease: "power2.out" }, t + 0.12);
        tl.set("#" + rippleId, { opacity: 1 }, t + 0.04);
        tl.fromTo("#" + rippleId, { scale: 0 }, { scale: 4, opacity: 0, duration: 0.7, ease: "power2.out", immediateRender: false }, t + 0.04);
      }
      // press-release-spring : compression linéaire, retour ressort, halo derrière (burst z1, bouton z2)
      function press(t, btn, burst) {
        var PRESS = 0.12;
        tl.to(btn, { scale: 0.94, boxShadow: "0 4px 10px -6px rgba(179,14,31,0.5)", duration: PRESS, ease: "power1.in" }, t);
        tl.to(btn, { scale: 1, boxShadow: "0 14px 30px -12px rgba(179,14,31,0.55)", duration: 0.55, ease: "back.out(1.6)" }, t + PRESS);
        tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 3.2, opacity: 0.5, duration: 0.45, ease: "power2.out" }, t + PRESS);
        tl.to(burst, { opacity: 0, duration: 0.5, ease: "power2.in" }, t + PRESS + 0.4);
      }

      // ---------- ambiance ----------
      breathe("#o2-halo", 0, DUR, 0.03, 1.7);
      tl.fromTo("#o2-ghost", { x: 30 }, { x: -30, duration: DUR, ease: "none" }, 0);

      // ---------- Scene 1 (0–3s) : cadre navigateur à ressort, la carte se compose ----------
      tl.fromTo("#o2-browser", { scale: 0.96, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 0);
      [["#o2-eyebrow", 0.7], ["#o2-f-email", 0.85], ["#o2-f-pwd", 1.0], ["#o2-btnwrap", 1.15], ["#o2-link", 1.3]].forEach(function (p) {
        tl.fromTo(p[0], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, p[1]);
      });
      tl.fromTo("#o2-note-l", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 1.8);
      tl.set(CUR, { x: 1500, y: 790 }, 0);

      // ---------- Scene 2 (3–11s) : email tapé, mot de passe, Se connecter ----------
      moveTo(3.3, 1232, 356, 0.8);
      click(4.2, "o2-rp-email");
      tl.to("#o2-in-email", { borderColor: "#E11D2E", boxShadow: "0 0 0 5px rgba(225,29,46,0.18)", duration: 0.25 }, 4.25);
      tl.to("#o2-ph-email", { opacity: 0, duration: 0.15 }, 4.5);

      // discrete-text-sequence : états de texte à seuils (≈45 ms/caractère, pauses humaines à « @ » et avant « .fr »)
      var EMAIL = "camille.roux@rollingstone.fr";
      var SEQ = [{ t: 0, text: "" }];
      var tt = 4.6;
      for (var i = 1; i <= EMAIL.length; i++) {
        var ch = EMAIL[i - 1];
        tt += 0.045;
        if (ch === "@" || (ch === "." && i > 20)) tt += 0.22;
        SEQ.push({ t: tt, text: EMAIL.substring(0, i) });
      }
      // chaque état est posé sur la timeline (saut instantané, seek-safe, sans callback)
      var typed = document.getElementById("o2-typed");
      SEQ.forEach(function (st) { tl.set(typed, { textContent: st.text }, st.t); });
      // caret : clignotement carré déterministe pendant la saisie (0,3 s par demi-période)
      var caret = document.getElementById("o2-caret");
      for (var c = 0, tc = 4.3; tc < 7.2; c++, tc += 0.3) tl.set(caret, { opacity: c % 2 === 0 ? 1 : 0 }, tc);
      tl.set(caret, { opacity: 0 }, 7.2);

      // mot de passe
      moveTo(6.6, 1232, 482, 0.6);
      click(7.3, "o2-rp-pwd");
      tl.to("#o2-in-email", { borderColor: "#E8E2D2", boxShadow: "0 0 0 0px rgba(225,29,46,0)", duration: 0.25 }, 7.35);
      tl.to("#o2-in-pwd", { borderColor: "#E11D2E", boxShadow: "0 0 0 5px rgba(225,29,46,0.18)", duration: 0.25 }, 7.35);
      tl.to("#o2-ph-pwd", { opacity: 0, duration: 0.15 }, 7.6);
      document.querySelectorAll("#o2-in-pwd > span:not(.o2-ph)").forEach(function (d, i) { tl.set(d, { opacity: 1 }, 7.7 + i * 0.08); });

      // Se connecter
      moveTo(9.2, 1232, 576, 0.8);
      tl.to("#o2-in-pwd", { borderColor: "#E8E2D2", boxShadow: "0 0 0 0px rgba(225,29,46,0)", duration: 0.25 }, 9.3);
      click(10.1, "o2-rp-login");
      press(10.1, "#o2-btn-login", "#o2-burst1");
      focus("o2-ring-btn", 10.3, 12.3);

      // ---------- Scene 3 (12–24s) : écran 2FA ----------
      // dynamic-content-sequencing : états de la carte pré-calculés, fondu croisé 0,5 s aux transitions uniquement
      var XF = 0.5;
      var STATES = [
        { el: "#o2-login", start: 0, end: 12.5 },
        { el: "#o2-2fa", start: 12.5, end: 25.0 },
        { el: "#o2-login", start: 25.0, end: DUR }
      ];
      STATES.forEach(function (s, i) {
        if (i === 0) return;
        var prev = STATES[i - 1];
        tl.to(prev.el, { opacity: 0, duration: XF, ease: "power1.inOut" }, s.start);
        tl.to(s.el, { opacity: 1, duration: XF, ease: "power1.inOut" }, s.start);
      });
      moveTo(12.5, 1560, 720, 0.8);
      tl.fromTo("#o2-phone", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 13.5);
      tl.fromTo("#o2-note-r1", { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 13.7);

      // les six cases se remplissent (0,3 s d'écart)
      document.querySelectorAll(".o2-box").forEach(function (box, i) {
        var t = 19.0 + i * 0.3;
        tl.fromTo(box.querySelector("span"), { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, t);
        tl.to(box, { borderColor: "#E11D2E", duration: 0.12 }, t);
        tl.to(box, { borderColor: "#E8E2D2", duration: 0.4 }, t + 0.35);
      });

      // Vérifier
      moveTo(21.2, 1232, 540, 0.8);
