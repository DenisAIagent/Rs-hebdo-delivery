    .f10-ctitle { margin-top: 10px; font-size: 34px; font-weight: 600; letter-spacing: -0.01em; }
    .f10-csub { margin-top: 10px; font-size: 24px; font-weight: 300; color: #6A6557; }

    .f10-btn { position: absolute; left: 36px; bottom: 32px; height: 66px; padding: 0 28px; border-radius: 10px; background: #E11D2E; color: #FFFFFF; font-size: 24px; font-weight: 700; display: grid; place-items: center;
      box-shadow: 0 18px 30px -14px rgba(179,14,31,0.55); }
    .f10-kw { display: inline-block; transform-origin: 50% 50%; text-shadow: 0 0 0 rgba(225,29,46,0); }

    .f10-att { position: absolute; left: -12px; top: -12px; pointer-events: none; overflow: visible; transform-origin: 50% 50%; }
    .f10-att rect { fill: none; stroke: #E11D2E; stroke-width: 3; }

    .f10-lockup { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
    .f10-logo { position: absolute; left: 570px; top: 350px; width: 780px; height: 164px; transform-origin: 50% 50%; }
    .f10-sign { position: absolute; left: 0; top: 556px; width: 1920px; text-align: center; font-family: "Instrument Serif", serif; font-size: 92px; line-height: 1.05; letter-spacing: -0.02em; color: #16140F; white-space: nowrap; }
    .f10-sign span { display: inline-block; }
    .f10-filet { position: absolute; left: 750px; top: 690px; width: 420px; height: 4px; overflow: visible; }
    .f10-filet path { fill: none; stroke: #E11D2E; stroke-width: 3; stroke-linecap: round; }
  </style>

  <div id="root" data-composition-id="10-fermeture" data-start="0" data-duration="20" data-width="1920" data-height="1080">
    <div class="f10-bg clip" data-start="0" data-duration="20" data-track-index="0">
      <div class="f10-halo" id="f10-halo"></div>
      <div class="f10-ghost" id="f10-ghost">HEBDO</div>
      <div class="f10-rule" id="f10-rule"></div>
    </div>

    <div class="f10-browser clip" id="f10-browser" data-start="0" data-duration="20" data-track-index="1">
      <div class="f10-bar"><span class="f10-dot"></span><span class="f10-dot"></span><span class="f10-dot"></span><span class="f10-url">hebdo-rs.up.railway.app</span></div>
      <div class="f10-nav"><span class="f10-brand">RS Hebdo Delivery</span><span class="f10-link on">Mon espace</span><span class="f10-link">Livrer un papier</span><span class="f10-chip">CR</span></div>
      <div class="f10-h2">Aide &amp; ressources</div>

      <div class="f10-card tuto" id="f10-card-tuto">
        <div class="f10-play"><svg viewBox="0 0 24 24"><path d="M6 3l14 9-14 9z"/></svg></div>
        <div class="f10-eyebrow">Tutoriel</div>
        <div class="f10-ctitle">Présentation vidéo</div>
        <div class="f10-csub">Le parcours complet, en quatre minutes</div>
        <div class="f10-btn"><span class="f10-kw" data-word="tuto">Revoir la présentation</span></div>
        <svg class="f10-att" width="724" height="444" viewBox="0 0 724 444"><rect class="f10-attr" id="f10-att-tuto" x="1.5" y="1.5" width="721" height="441" rx="12"/></svg>
      </div>
      <div class="f10-card doc" id="f10-card-doc">
        <div class="f10-eyebrow">Documentation</div>
        <div class="f10-ctitle"><span class="f10-kw" data-word="guide">Guide écrit pas-à-pas</span></div>
        <div class="f10-read">Lire</div>
        <svg class="f10-att" width="644" height="220" viewBox="0 0 644 220"><rect class="f10-attr" id="f10-att-doc" x="1.5" y="1.5" width="641" height="217" rx="12"/></svg>
      </div>
      <div class="f10-card contact" id="f10-card-contact">
        <div class="f10-eyebrow">Contact</div>
        <div class="f10-ctitle"><span class="f10-kw" data-word="contact">Rédaction en chef</span></div>
        <div class="f10-mail">redac@rollingstone.fr</div>
        <svg class="f10-att" width="644" height="220" viewBox="0 0 644 220"><rect class="f10-attr" id="f10-att-contact" x="1.5" y="1.5" width="641" height="217" rx="12"/></svg>
      </div>
    </div>

    <div class="f10-lockup clip" id="f10-lockup" data-start="0" data-duration="20" data-track-index="2">

      <div class="f10-sign" id="f10-sign"><span>RS</span> <span>Hebdo</span> <span>Delivery</span></div>
      <svg class="f10-filet" viewBox="0 0 420 4"><path id="f10-filet-p" d="M2 2 L418 2"/></svg>
    </div>

    <div class="f10-grain clip" data-start="0" data-duration="20" data-track-index="3">
      <svg width="1920" height="1080"><filter id="f10-noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.09 0 0 0 0 0.08 0 0 0 0 0.06 0 0 0 1 0"/></filter><rect width="1920" height="1080" filter="url(#f10-noise)"/></svg>
    </div>
  </div>

  <script>
    (function () {
      var ID = "10-fermeture", D = 20;
      var $ = function (id) { return document.getElementById(id); };
      var tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};

      /* attention outlines: measure + hide */
      var atts = {};
      ["tuto", "doc", "contact"].forEach(function (k) {
        var r = $("f10-att-" + k), len = r.getTotalLength() * 1.02;
        r.style.strokeDasharray = len; r.style.strokeDashoffset = len; atts[k] = len;
      });
      var filet = $("f10-filet-p"), filetLen = filet.getTotalLength() * 1.02;
      filet.style.strokeDasharray = filetLen; filet.style.strokeDashoffset = filetLen;

      /* ---- asr-keyword-glow: one linear driver, attack / sustain / release ---- */
      var TIMINGS = { guide: { start: 3.5, end: 5.2 }, tuto: { start: 7.0, end: 8.7 }, contact: { start: 10.0, end: 11.7 } };
      var ATTACK = 0.2, RELEASE = 0.45, REST = 0.25, MAX_BLUR = 22, MAX_BOOST = 0.07;
      function envelope(t, s, e) {
        if (t < s) return 0;
        if (t < e) return Math.min((t - s) / ATTACK, 1);
        if (t < e + RELEASE) return 1 - ((t - e) / RELEASE) * (1 - REST);
        return REST;
      }
      var words = document.querySelectorAll("#root .f10-kw");
      var drv = { t: 0 };
      tl.to(drv, { t: D, duration: D, ease: "none", onUpdate: function () {
        var t = drv.t;
        words.forEach(function (el) {
          var tm = TIMINGS[el.dataset.word]; if (!tm) return;
          var env = envelope(t, tm.start, tm.end);
          el.style.textShadow = "0 0 " + (MAX_BLUR * env) + "px rgba(225,29,46," + (0.9 * env) + ")";
          el.style.transform = "scale(" + (1 + MAX_BOOST * env) + ")";
        });
        gsap.set("#f10-halo", { scale: 1 + 0.05 * Math.sin(t * 0.7) });
      } }, 0);
      tl.fromTo("#f10-ghost", { x: -30 }, { x: 30, duration: D, ease: "none" }, 0);

      /* ---- Scene 1 (0–11s): cards in place, attention per phrase ---- */
      tl.fromTo("#f10-browser", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 0);
      tl.fromTo(["#f10-card-tuto", "#f10-card-doc", "#f10-card-contact"], { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.06 }, 0.3);

      function attention(k, at, until) {
        tl.to("#f10-att-" + k, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, at);
        tl.to("#f10-card-" + k + " .f10-att", { scale: 1.008, duration: 0.6, ease: "sine.inOut" }, at + 0.7);
        tl.to("#f10-card-" + k + " .f10-att", { scale: 1.0, duration: 0.6, ease: "sine.inOut" }, at + 1.3);
        tl.to("#f10-card-" + k + " .f10-att", { scale: 1.008, duration: 0.6, ease: "sine.inOut" }, at + 1.9);
        tl.to("#f10-card-" + k + " .f10-att", { scale: 1.0, duration: 0.4, ease: "sine.inOut" }, at + 2.5);
        tl.to("#f10-att-" + k, { strokeDashoffset: atts[k], duration: 0.4, ease: "power2.in" }, until);
      }
      attention("doc", 3.4, 6.5);
      attention("tuto", 6.9, 9.5);
      attention("contact", 9.9, 12.6);

      /* ---- Scene 2 (11–20s): cards fade (final frame), logo lockup, fade to paper ---- */
      tl.to("#f10-browser", { opacity: 0, y: -16, duration: 0.9, ease: "power2.inOut" }, 13.0);

      // spring-pop-entrance — smooth long-tail settle, no overshoot
      tl.fromTo("#f10-logo", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 13.5);
      tl.fromTo("#f10-sign span", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out", stagger: 0.12 }, 14.3);

      // svg-path-draw — the filet under the signature
      tl.to("#f10-filet-p", { strokeDashoffset: 0, duration: 0.7, ease: "power2.out" }, 15.2);

      // halo calms
      tl.to("#f10-halo", { opacity: 0.45, duration: 3.0, ease: "power1.inOut" }, 13.0);

      // general fade to bare paper over the last 1.5 s
      tl.to(["#f10-lockup", "#f10-halo", "#f10-ghost", "#f10-rule"], { opacity: 0, duration: 1.5, ease: "power1.inOut" }, 18.5);

      window.__timelines[ID] = tl;
      tl.seek(0);
    })();
  </script>
